<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tank Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14142b;--panel:#23234a;--cream:#f4efe4;--red:#ff3d5a;--yel:#ffc400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font:500 18px 'Barlow Condensed',sans-serif;overflow:hidden;touch-action:none}
h1,h2,button{font-family:Bangers,cursive;font-weight:400;letter-spacing:.06em;margin:0}
h1{font-size:56px;text-align:center}h2{font-size:28px}
#lobby{max-width:560px;margin:0 auto;padding:24px 16px;height:100%;overflow:auto;touch-action:pan-y}
.sub{text-align:center;margin:4px 0 22px;opacity:.8}
section{border:3px solid var(--cream);border-radius:20px;background:var(--panel);padding:16px 20px;margin-bottom:22px;box-shadow:5px 6px 0 var(--cream)}
section p{margin:8px 0 14px}.row{display:flex;gap:12px}
input{flex:1;min-width:0;background:var(--panel);color:var(--cream);border:3px solid var(--cream);border-radius:14px;padding:10px 14px;font:inherit;font-size:18px;user-select:text}
input#code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
button{border:3px solid var(--cream);border-radius:16px;padding:8px 20px;font-size:26px;color:var(--cream);background:var(--red);box-shadow:4px 5px 0 var(--cream);cursor:pointer}
button.yel{background:var(--yel);color:#1a1a2e}button:active{transform:translate(2px,3px);box-shadow:2px 2px 0 var(--cream)}
button:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
#err{color:var(--red);text-align:center;min-height:1.4em}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 14px;pointer-events:none;font-family:Bangers;font-size:34px;letter-spacing:.05em}
#hud .you{color:#6aa8ff}#board{font-size:22px;line-height:1.1;text-align:right;text-shadow:0 2px 0 #000}
#mid{text-align:center;font:700 16px 'Barlow Condensed';pointer-events:auto}
#chip{border:2px solid var(--cream);border-radius:12px;padding:2px 12px;background:var(--panel);cursor:pointer;font-size:18px;letter-spacing:.2em}
#status{margin-top:4px;opacity:.85}
#ctrls{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:26px;align-items:center}
#stick{width:140px;height:140px;border-radius:50%;background:#ffffff1f;border:3px solid var(--cream);position:relative;touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:52px;height:52px;border-radius:50%;background:var(--cream);box-shadow:0 3px 0 #0006}
#fire{width:104px;height:104px;border-radius:50%;font-size:30px;touch-action:none}
#end{position:fixed;inset:0;background:#14142bd9;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center}
#end h2{font-size:72px}[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main id="lobby">
<h1>TANK BATTLE</h1><p class="sub">Free-for-all in a random maze. Any number of players, random spawns, first to 10 kills wins.</p>
<section><h2>🚦 CREATE A ROOM</h2><p>You become the referee. Share the room code or invite link with everyone who wants to play.</p>
<div class="row"><input id="pin" placeholder="Referee PIN (optional)" maxlength="12"><button id="create" class="red">CREATE ROOM</button></div></section>
<section><h2>🏎️ JOIN A ROOM</h2><p>Got a code from your referee? Type it here.</p>
<div class="row"><input id="code" placeholder="CODE" maxlength="5" autocomplete="off"><button id="join" class="yel">ENTER</button></div></section>
<div id="err" role="alert"></div></main>
<canvas id="cv" hidden></canvas>
<div id="hud" hidden><div class="you">YOU <span id="s1">0</span></div>
<div id="mid"><div id="chip" title="Copy invite link"></div><div id="status"></div></div>
<div class="foe" id="board"></div></div>
<div id="ctrls" hidden><div id="stick" aria-label="Move"><div id="knob"></div></div><button id="fire">FIRE</button></div>
<div id="end" hidden><h2 id="endt"></h2><p id="endp"></p><button id="again" hidden>REMATCH</button></div>
<script>
const $=id=>document.getElementById(id),N=9,T=220,W=24,R=22,SP=230,BS=560,WIN=10;
const api=b=>fetch('/api/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Server error');return j});
function rng(s){let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Map: a random trail network. Every used cell has 2 or 4 open sides (what the tileset can draw); spawns have 1; unused cells are solid black.
function genMap(seed){
  const rnd=rng(seed),rot=i=>N*N-1-i,C=(N*N-1)/2,S0=N*(N-1)+(N-1)/2,S1=rot(S0),ALL=[...Array(N*N).keys()];
  const nb=i=>{const x=i%N,y=i/N|0,o=[];if(x>0)o.push(i-1);if(x<N-1)o.push(i+1);if(y>0)o.push(i-N);if(y<N-1)o.push(i+N);return o};
  const key=(a,b)=>a<b?a+','+b:b+','+a,md=i=>Math.abs(i%N-4)+Math.abs((i/N|0)-4);
  let edges,deg;
  const add=(a,b)=>{edges.add(key(a,b));deg[a]++;deg[b]++};
  const route=(a,b)=>{ // random-cost shortest path over unused edges; middle cells may hold at most 2 more edges
    const dist=new Map([[a,0]]),prev=new Map(),todo=[a],done=new Set();
    while(todo.length){todo.sort((p,q)=>dist.get(q)-dist.get(p));const i=todo.pop();if(done.has(i))continue;done.add(i);if(i===b)break;
      for(const j of nb(i)){if(edges.has(key(i,j)))continue;
        if(i===S0&&j!==S0-N||j===S0&&i!==S0-N||i===S1&&j!==S1+N||j===S1&&i!==S1+N)continue;
        if(j!==b&&(deg[j]>2||j===S0||j===S1||j===C))continue;
        const c=dist.get(i)+.5+rnd();if(!dist.has(j)||c<dist.get(j)){dist.set(j,c);prev.set(j,i);todo.push(j)}}}
    if(!prev.has(b))return false;for(let j=b;j!==a;j=prev.get(j))add(prev.get(j),j);return true};
  const bfs=s=>{const D=new Map([[s,0]]),q=[s];for(const i of q)for(const j of nb(i))if(!D.has(j)&&edges.has(key(i,j))){D.set(j,D.get(i)+1);q.push(j)}return D.get(C)};
  for(let tries=0;;tries++){
    edges=new Set();deg=new Array(N*N).fill(0);
    let w=0;do{w=ALL[rnd()*ALL.length|0]}while(md(w)<2||md(w)>4||w===S0||w===S1);
    // spawn -> center -> loop out and back to center -> other spawn: center ends with all 4 sides open
    if(!(route(S0,C)&&route(C,w)&&route(w,C)&&route(C,S1)))continue;
    for(let k=5+(rnd()*4|0);k>0;k--){ // extra loops attach at cells with 2 open sides, which become crossings
      const used=ALL.filter(i=>deg[i]===2&&i!==C),free=ALL.filter(i=>deg[i]===0);if(!used.length||!free.length)break;
      const a=used[rnd()*used.length|0],f=free[rnd()*free.length|0],se=new Set(edges),sd=deg.slice();
      if(!(route(a,f)&&route(f,a))){edges=se;deg=sd}}
    if(tries<300&&Math.abs(bfs(S0)-bfs(S1))>2)continue; // keep both spawns about equally far from the center
    const walls=[],tiles=[],rc=(x,y,w,h)=>walls.push({x,y,w,h});
    ALL.forEach(i=>{const x0=i%N*T,y0=(i/N|0)*T;
      if(!deg[i]){rc(x0,y0,T,T);return}
      const o={n:i>=N&&edges.has(key(i,i-N)),s:i<N*(N-1)&&edges.has(key(i,i+N)),w:i%N>0&&edges.has(key(i,i-1)),e:i%N<N-1&&edges.has(key(i,i+1))};
      const k=i===C?'center':i===S0||i===S1?'spawn':deg[i]===4?'cross':o.n&&o.s?'v':o.e&&o.w?'h':o.s&&o.e?'dr':o.s&&o.w?'dl':o.n&&o.e?'ur':'ul';
      tiles.push({x:x0,y:y0,k,r:i===S1});
      if(i===C){const q=T*.2;for(const[a,b]of[[0,0],[1,0],[0,1],[1,1]])rc(x0+a*(T-q),y0+b*(T-q),q,q);return}
      if(!o.n)rc(x0,y0,T,W);if(!o.s)rc(x0,y0+T-W,T,W);if(!o.w)rc(x0,y0,W,T);if(!o.e)rc(x0+T-W,y0,W,T);
      for(const[a,b]of[[0,0],[1,0],[0,1],[1,1]])rc(x0+a*(T-W),y0+b*(T-W),W,W)});
    const sp=i=>({x:(i%N+.5)*T,y:((i/N|0)+.5)*T});
    return{walls,tiles,spots:ALL.filter(i=>deg[i]&&i!==C).map(sp)}}
}
const hitWall=(x,y,r)=>{for(const w of map.walls){const dx=x-Math.max(w.x,Math.min(x,w.x+w.w)),dy=y-Math.max(w.y,Math.min(y,w.y+w.h));if(dx*dx+dy*dy<r*r)return true}return false};
function push(o,r){for(const w of map.walls){const cx=Math.max(w.x,Math.min(o.x,w.x+w.w)),cy=Math.max(w.y,Math.min(o.y,w.y+w.h)),dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);if(d>0&&d<r){o.x+=dx/d*(r-d);o.y+=dy/d*(r-d)}}}
let room,pid,pin='',round=0,seed,map,me,mb,rb,seenB,fx=[],fl=0,kb,kills,lastK,others,over,inv,cd=0,bid=0,busy=false,firing=false,jx=0,jy=0,syncTimer;
const keys={};
// Tileset images live in /assets (file names must match exactly, including case)
const FILES={spawn:'Spawnpoint',center:'CenterTile',tank:'Character',h:'Horizontal tile',v:'Vertical tile',dr:'Down to right tile',dl:'Down to left tile',cross:'Cross Path tile',ur:'Up to right tile',ul:'Up to left tile'},IMG={};
const loadAssets=()=>Promise.all(Object.entries(FILES).map(([k,f])=>new Promise(res=>{const im=new Image();im.onload=()=>{IMG[k]=im;res(null)};im.onerror=()=>res(f+'.png');im.src=encodeURI('assets/'+f+'.png')}))).then(r=>r.filter(Boolean));
const spawnAt=()=>{const p=map.spots[Math.random()*map.spots.length|0];me.x=p.x;me.y=p.y;me.a=Math.random()*6.28};
function reset(){map=genMap(seed);me={x:0,y:0,a:0};spawnAt();mb=[];rb=[];fx=[];fl=0;seenB=new Set();kb={};kills=0;lastK={};others=new Map();over=false;inv=1.5;$('end').hidden=true}
function start(j){room=j;pid=j.pid;round=j.round;seed=j.seed;history.replaceState(null,'','?room='+j.code);
  $('lobby').hidden=true;['cv','hud','ctrls'].forEach(i=>$(i).hidden=false);$('chip').textContent=j.code;reset();requestAnimationFrame(loop);syncTimer=setInterval(sync,125)}
async function enter(fn){$('err').textContent='';try{const miss=await loadAssets();if(miss.length)throw new Error('Missing in /assets: '+miss.join(', '));start(await fn())}catch(e){$('err').textContent=e.message}}
$('create').onclick=()=>{pin=$('pin').value;enter(()=>api({op:'create',pin}))};
$('join').onclick=()=>enter(()=>api({op:'join',code:$('code').value.trim()}));
$('chip').onclick=()=>{navigator.clipboard?.writeText(location.origin+'?room='+room.code);$('status').textContent='Invite link copied'};
$('again').onclick=()=>api({op:'reset',code:room.code,pin}).catch(e=>$('endp').textContent=e.message);
const q=new URLSearchParams(location.search).get('room');if(q){$('code').value=q.toUpperCase();$('code').focus()}
async function sync(){if(busy||!room)return;busy=true;
  try{const j=await api({op:'sync',code:room.code,pid,state:{x:me.x|0,y:me.y|0,a:+me.a.toFixed(2),k:kills,kb,b:mb.map(b=>[b.id,b.x|0,b.y|0,b.vx|0,b.vy|0])}});
    if(j.round!==round){round=j.round;seed=j.seed;reset();busy=false;return}
    const live=new Set();
    for(const{pid:id,s}of j.others){live.add(id);let p=others.get(id);if(!p)others.set(id,p={x:s.x,y:s.y});
      p.tx=s.x;p.ty=s.y;p.a=s.a;p.k=s.k||0;
      const n=(s.kb||{})[pid]||0;if(n>(lastK[id]||0)){kills+=n-(lastK[id]||0);lastK[id]=n} // victims report who killed them
      for(const[i,x,y,vx,vy]of s.b){const key=id+':'+i;if(!seenB.has(key)){seenB.add(key);rb.push({x,y,vx,vy,life:1.4,o:id})}}}
    for(const id of[...others.keys()])if(!live.has(id))others.delete(id);
    $('err').textContent=''}catch(e){$('status').textContent=e.message}busy=false}
function die(by){kb[by]=(kb[by]||0)+1;fx.push({x:me.x,y:me.y,t:.3});fl=.4;spawnAt();inv=1.5}
const scoreList=()=>[[pid,kills],...[...others].map(([id,p])=>[id,p.k||0])].sort((a,b)=>b[1]-a[1]);
function moveBullets(a,dt){return a.filter(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;return b.life>0&&!hitWall(b.x,b.y,4)})}
function update(dt){
  if(!over){
    let ix=jx+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=jy+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
    const m=Math.min(1,Math.hypot(ix,iy));
    if(m>.15){me.a=Math.atan2(iy,ix);me.x+=Math.cos(me.a)*SP*m*dt;me.y+=Math.sin(me.a)*SP*m*dt;push(me,R)}
    cd-=dt;inv-=dt;
    if((firing||keys[' '])&&cd<=0){cd=.45;const c=Math.cos(me.a),s=Math.sin(me.a);mb.push({id:++bid,x:me.x+c*30,y:me.y+s*30,vx:c*BS,vy:s*BS,life:1.6})}
    mb=moveBullets(mb,dt);rb=moveBullets(rb,dt);
    // A bullet vanishes on contact with any tank other than its owner; damage itself is decided by the victim's own client.
    const hitOther=b=>{for(const[id,p]of others)if(id!==b.o&&Math.hypot(b.x-p.x,b.y-p.y)<R+5){p.fl=.4;fx.push({x:b.x,y:b.y,t:.3});return true}return false};
    mb=mb.filter(b=>!hitOther(b));
    rb=rb.filter(b=>{if(Math.hypot(b.x-me.x,b.y-me.y)<R+5){if(inv<=0)die(b.o);return false}return !hitOther(b)});
    const top=scoreList();
    if(top[0][1]>=WIN){over=true;const w=top[0][0]==pid;$('endt').textContent=w?'YOU WIN!':'P'+top[0][0]+' WINS';
      $('endp').textContent=pid===0?'You are the referee. Start another round when ready.':'Waiting for the referee to start a rematch.';$('again').hidden=pid!==0;$('end').hidden=false}
  }
  if(fl>0)fl-=dt;fx=fx.filter(f=>(f.t-=dt)>0);for(const p of others.values()){if(p.fl>0)p.fl-=dt;const k=Math.min(1,dt*12);p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k}
  $('s1').textContent=kills;$('board').innerHTML=scoreList().slice(0,4).map(([id,v])=>`<div>${id==pid?'YOU':'P'+id} ${v}</div>`).join('');
  if(!over)$('status').textContent=!others.size?'Waiting for players…':others.size+1+' players · first to '+WIN;
}
const cv=$('cv'),ctx=cv.getContext('2d');
function tank(x,y,a,col,blink,lab,fl){if(blink)ctx.globalAlpha=.4;ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,R+5,0,7);ctx.stroke();
  ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);ctx.drawImage(IMG.tank,-32,-32,64,64);ctx.restore();if(fl>0){ctx.fillStyle=`rgba(255,40,60,${.75*Math.min(1,fl/.4)})`;ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill()}ctx.globalAlpha=1;if(lab){ctx.fillStyle=col;ctx.font='700 18px sans-serif';ctx.textAlign='center';ctx.fillText(lab,x,y-R-12)}}
function draw(){
  const dpr=devicePixelRatio||1,w=innerWidth*dpr|0,h=innerHeight*dpr|0;if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#14142b';ctx.fillRect(0,0,w,h);
  const z=Math.min(w,h)/(T*3.2);ctx.setTransform(z,0,0,z,w/2-me.x*z,h/2-me.y*z);
  ctx.fillStyle='#000';ctx.fillRect(0,0,N*T,N*T);
  for(const t of map.tiles){if(t.r){ctx.save();ctx.translate(t.x+T/2,t.y+T/2);ctx.rotate(Math.PI);ctx.drawImage(IMG[t.k],-T/2,-T/2,T,T);ctx.restore()}else ctx.drawImage(IMG[t.k],t.x,t.y,T,T)}
  ctx.lineWidth=4;for(const f of fx){ctx.strokeStyle=`rgba(255,61,90,${f.t/.3})`;ctx.beginPath();ctx.arc(f.x,f.y,R*.5+(.3-f.t)*160,0,7);ctx.stroke()}
  ctx.fillStyle='#f4efe4';ctx.strokeStyle='#14142b';ctx.lineWidth=2;
  for(const b of[...mb,...rb]){ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill();ctx.stroke()}
  for(const[id,p]of others)tank(p.x,p.y,p.a,`hsl(${id*137.5%360} 85% 60%)`,false,'P'+id,p.fl);tank(me.x,me.y,me.a,'#3d8bff',inv>0&&(inv*10|0)%2,'',fl)}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
// Controls: joystick and fire button sit side by side
const stick=$('stick'),knob=$('knob');let drag=false;
function mv(e){const r=stick.getBoundingClientRect(),mx=r.width/2;let dx=e.clientX-r.left-mx,dy=e.clientY-r.top-mx;const dd=Math.hypot(dx,dy),c=Math.min(dd,mx);if(dd){dx=dx/dd*c;dy=dy/dd*c}jx=dx/mx;jy=dy/mx;knob.style.transform=`translate(${dx}px,${dy}px)`}
stick.onpointerdown=e=>{drag=true;stick.setPointerCapture(e.pointerId);mv(e)};
stick.onpointermove=e=>{if(drag)mv(e)};
stick.onpointerup=stick.onpointercancel=()=>{drag=false;jx=jy=0;knob.style.transform=''};
const fire=$('fire');fire.onpointerdown=e=>{firing=true;fire.setPointerCapture(e.pointerId)};fire.onpointerup=fire.onpointercancel=()=>firing=false;
addEventListener('keydown',e=>{if(e.target.tagName!=='INPUT'){keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
</script></body></html>
